hierarchies:
  YQMD:
    name: YQMD
    label: Year, Quarter, Month, Day
    default_level: MONTH
    leaf_level: DAY
    levels:
      - key: YEAR
        label: Year
      - key: QUARTER
        label: Quarter
      - key: MONTH
        label: Month
      - key: DAY
        label: Day
  YQHMD:
    name: YQHMD
    label: Year, Half-Year, Quarter, Month, Day
    default_level: MONTH
    leaf_level: DAY
    levels:
      - key: YEAR
        label: Year
      - key: HALF_YEAR
        label: Half-Year
      - key: QUARTER
        label: Quarter
      - key: MONTH
        label: Month
      - key: DAY
        label: Day
  YQM:
    name: YQM
    label: Year, Quarter, Month
    default_level: MONTH
    leaf_level: MONTH
    levels:
      - key: YEAR
        label: Year
      - key: QUARTER
        label: Quarter
      - key: MONTH
        label: Month
